<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaHub - Admin Login</title>
    <link rel="stylesheet" href="1.css">

    <style>
        /* Error messages default me hidden */
        .field-error {
            display: none;
            margin-top: 0.4rem;
            font-size: 0.85rem;
            color: var(--danger-color);
        }

        /* Galat input: red border */
        .login-form input:user-invalid {
            border-color: var(--danger-color);
        }

        /* Sahi input: green border */
        .login-form input:user-valid {
            border-color: var(--success-color);
        }

        /* Khali field: "required" message */
        .login-form input:user-invalid:placeholder-shown ~ .error-empty {
            display: block;
        }

        /* Kuch likha hai par galat hai: "invalid" message */
        .login-form input:user-invalid:not(:placeholder-shown) ~ .error-invalid {
            display: block;
        }
    </style>
</head>
<body class="login-body">
    <!-- Login Container -->
    <div class="login-container">
        <div class="login-box">
            <div class="logo-login">
                <h1>🎬 CinemaHub</h1>
                <p>Admin Portal</p>
            </div>

            <!-- Login Form: valid hone par hi 2.html khulega -->
            <form class="login-form" id="loginForm" action="2.html" method="get">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        pattern="admin"
                        title="Username must be: admin"
                        required>
                    <small class="field-error error-empty">Username is required.</small>
                    <small class="field-error error-invalid">Username is incorrect.</small>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        pattern="admin123"
                        title="Password is incorrect"
                        required>
                    <small class="field-error error-empty">Password is required.</small>
                    <small class="field-error error-invalid">Password is incorrect.</small>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-login">Login</button>
            </form>

            <div class="login-footer">
                <p>Default: <strong>admin</strong> | <strong>admin123</strong></p>
            </div>
        </div>
    </div>
</body>
</html>
