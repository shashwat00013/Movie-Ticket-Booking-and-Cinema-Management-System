<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Booking</title>
    <link rel="stylesheet" href="css/booking.css">
</head>

<body>

<header>
    <h1>Movie Ticket Booking</h1>
</header>


<section class="booking-container">

    <div class="movie-card">

        <img src="https://via.placeholder.com/250x300" alt="movie">

        <h2>Avengers End Game</h2>

        <p>🎬 Theater: PVR Cinemas</p>

        <p>📅 Date: 20 September 2026</p>

        <p>⏰ Show Time: 7:30 PM</p>

    </div>



    <div class="booking-form">

        <h2>Booking Details</h2>


        <label>Name</label>
        <input type="text" placeholder="Enter Name">


        <label>Email</label>
        <input type="email" placeholder="Enter Email">


        <label>Select Seats</label>

        <div class="seats">

            <button>A1</button>
            <button>A2</button>
            <button>A3</button>
            <button>B1</button>
            <button>B2</button>
            <button>B3</button>

        </div>


        <h3>Total Price: ₹600</h3>


        <a href="ticket.html">
            <button class="confirm">
                Confirm Booking
            </button>
        </a>


    </div>


</section>


</body>

</html>
