
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook - Vendor Registration</title>

    <link rel="stylesheet" href="CSS/vendor.css">
    <link rel="stylesheet" href="CSS/vendor-register.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <h1>Create Vendor Account</h1>
        <p>Register your business with CineBook</p>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Business Name</label>
                <input type="text" id="businessName" placeholder="Enter business name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="registerEmail" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="mobileNumber" placeholder="10-digit mobile number" required>
            </div>

            <div class="form-group">
                <label>Business Address</label>
                <textarea id="businessAddress" placeholder="Enter business address" required></textarea>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Create password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="login-btn">Create Account →</button>

        </form>

        <div class="register-section">
            <p>Already have an account?</p>
            <a href="vendor-login.html">Back to Sign In →</a>
        </div>

    </div>
</div>

<script src="JS/vendor-register.js"></script>
</body>
</html>
