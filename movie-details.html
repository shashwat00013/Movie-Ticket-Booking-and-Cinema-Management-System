<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Details | CineBook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
<a href="index.html" class="logo">Cine<span>Book</span></a>
<nav><a href="index.html#movies">Movies</a><a href="index.html#upcoming">Upcoming</a><a href="index.html#theaters">Theaters</a></nav>
<a href="index.html" class="nav-btn">Back to Movies</a>
</header>

<main class="details-page">
<section class="details-hero">
<div class="large-poster" id="detail-poster">
<span class="poster-tag" id="detail-tag">MOVIE</span>
<div class="poster-title" id="detail-poster-title">MOVIE</div>
<small id="detail-year"></small>
</div>
<div class="details-content">
<p class="eyebrow">MOVIE DETAILS</p>
<h1 id="detail-title">Movie</h1>
<p class="details-meta" id="detail-meta"></p>
<div class="rating-box"><strong id="detail-date"></strong><span id="detail-status"></span></div>
<p class="description" id="detail-description"></p>
<div class="details-tags" id="detail-tags"></div>
<a href="index.html#movies" class="primary-btn">Back to Movies</a>
</div>
</section>

<section class="details-section">
<div class="section-heading"><div><p class="eyebrow">MORE MOVIES</p><h2>Explore CineBook</h2></div></div>
<p>Discover more movies in the <a href="index.html#movies">Now Showing</a> and <a href="index.html#upcoming">Upcoming Movies</a> sections.</p>
</section>
</main>
<footer><div class="footer-logo">Cine<span>Book</span></div><p>Movies • Theaters • Showtimes</p></footer>

<script src="script.js" defer></script>
</body>
</html>
